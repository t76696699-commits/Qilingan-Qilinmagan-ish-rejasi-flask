<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirtqi va Ichki vazifalar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ versioned_static('css.css') }}">
</head>
<body>
<header>
    <div class="forms-wrapper">
        <!-- 1. Sirtqi vazifa qo'shish formasi -->
        <form id="add-main-form">
            <div class="row">
                <h1>Sirtqi:</h1>
                <input type="text" name="main_title" placeholder="Sirtqi vazifa nomi..." required autocomplete="off">
                <button type="submit">Qo'shish</button>
            </div>
        </form>

        <!-- 2. Ichki vazifa qo'shish formasi -->
        <form id="add-sub-form">
            <div class="row">
                <h1>Ichki vazifa:</h1>
                <select name="main_task_id" id="main_task_select" required>
                    <option value="">Sirtqini tanlang</option>
                    {% for task in main_tasks %}
                        <option value="{{ task.id }}">{{ task.title }}</option>
                    {% endfor %}
                </select>
                <input type="text" name="sub_title" placeholder="Fan yoki tartib..." required autocomplete="off">
                <button type="submit">Qo'shish</button>
            </div>
        </form>
    </div>
</header>

<main>
    <section>
        <!-- 1-Ustun: Sirtqi vazifalar -->
        <div class="column">
            <h1>Sirtqi vazifalar</h1>
            <div class="sirtqi_list">
                {% for item in main_tasks %}
                    <div class="h2 main-item" data-id="{{ item.id }}">
                        <h2>{{ item.title }}</h2>
                        <i class="fa-solid fa-chevron-right" style="color: #00ff66;"></i>
                    </div>
                {% endfor %}
            </div>
        </div>

        <!-- 2-Ustun: Tanlangan sirtqining Ichidagi narsalar -->
        <div class="column">
            <h1 id="subtask-header-title">Ichidagi narsalar</h1>
            <div class="ichidan_ochiladigan">
                <p class="placeholder-text">Sirtqi vazifalardan birini bosing...</p>
            </div>
        </div>
    </section>
</main>

<script src="{{ versioned_static('js.js') }}"></script>
</body>
</html>
